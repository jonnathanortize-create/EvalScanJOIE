# Codemagic CI/CD Configuration for EvalScan
# Compilación automatizada de APK para Android utilizando Capacitor

workflows:
  evalscan-android:
    name: EvalScan Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 20.18.0
      java: 17
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'master'
          include: true
          source: true
    scripts:
      - name: Instalar dependencias del proyecto
        script: |
          npm ci || npm install

      - name: Compilar aplicación web de producción (Vite)
        script: |
          npm run build

      - name: Sincronizar activos web con el proyecto nativo Android Capacitor
        script: |
          npx cap sync android

      - name: Compilar APK Android con Gradle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/mapping/**/mapping.txt

    publishing:
      email:
        recipients:
          - jonnathan.ortiz.e@gmail.com
        notify:
          success: true
          failure: true
