<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="evalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="104" fill="url(#evalGrad)" />
  
  <!-- Sheet shape -->
  <g filter="url(#shadow)">
    <rect x="96" y="80" width="320" height="352" rx="20" fill="#ffffff" />
    
    <!-- Corner Fiducial Markers on Sheet -->
    <rect x="116" y="100" width="32" height="32" fill="#0f172a" rx="4"/>
    <rect x="124" y="108" width="16" height="16" fill="#ffffff" rx="2"/>
    <rect x="128" y="112" width="8" height="8" fill="#0f172a" rx="1"/>

    <rect x="364" y="100" width="32" height="32" fill="#0f172a" rx="4"/>
    <rect x="372" y="108" width="16" height="16" fill="#ffffff" rx="2"/>
    <rect x="376" y="112" width="8" height="8" fill="#0f172a" rx="1"/>

    <rect x="116" y="380" width="32" height="32" fill="#0f172a" rx="4"/>
    <rect x="124" y="388" width="16" height="16" fill="#ffffff" rx="2"/>
    <rect x="128" y="392" width="8" height="8" fill="#0f172a" rx="1"/>

    <rect x="364" y="380" width="32" height="32" fill="#0f172a" rx="4"/>
    <rect x="372" y="388" width="16" height="16" fill="#ffffff" rx="2"/>
    <rect x="376" y="392" width="8" height="8" fill="#0f172a" rx="1"/>

    <!-- Header lines -->
    <rect x="164" y="108" width="180" height="10" rx="5" fill="#0284c7" />
    <rect x="164" y="126" width="120" height="6" rx="3" fill="#94a3b8" />

    <!-- OMR Question Rows with Bubbles -->
    <!-- Q1 -->
    <text x="124" y="180" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569">1</text>
    <circle cx="160" cy="176" r="10" fill="#0f172a" />
    <text x="160" y="180" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
    <circle cx="195" cy="176" r="10" fill="none" stroke="#64748b" stroke-width="2" />
    <text x="195" y="180" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">B</text>
    <circle cx="230" cy="176" r="10" fill="none" stroke="#64748b" stroke-width="2" />
    <text x="230" y="180" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">C</text>
    <circle cx="265" cy="176" r="10" fill="none" stroke="#64748b" stroke-width="2" />
    <text x="265" y="180" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">D</text>

    <!-- Q2 -->
    <text x="124" y="220" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569">2</text>
    <circle cx="160" cy="216" r="10" fill="none" stroke="#64748b" stroke-width="2" />
    <text x="160" y="220" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">A</text>
    <circle cx="195" cy="216" r="10" fill="none" stroke="#64748b" stroke-width="2" />
    <text x="195" y="220" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">B</text>
    <circle cx="230" cy="216" r="10" fill="#0f172a" />
    <text x="230" y="220" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
    <circle cx="265" cy="216" r="10" fill="none" stroke="#64748b" stroke-width="2" />
    <text x="265" y="220" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">D</text>

    <!-- Q3 -->
    <text x="124" y="260" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569">3</text>
    <circle cx="160" cy="256" r="10" fill="none" stroke="#64748b" stroke-width="2" />
    <text x="160" y="260" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">A</text>
    <circle cx="195" cy="256" r="10" fill="#0f172a" />
    <text x="195" y="260" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
    <circle cx="230" cy="256" r="10" fill="none" stroke="#64748b" stroke-width="2" />
    <text x="230" y="260" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">C</text>
    <circle cx="265" cy="256" r="10" fill="none" stroke="#64748b" stroke-width="2" />
    <text x="265" y="260" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">D</text>

    <!-- Scanner Target & Green Checkmark Accent -->
    <g transform="translate(300, 200)">
      <circle cx="48" cy="48" r="44" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="4" stroke-dasharray="8 6"/>
      <path d="M32 48 L44 60 L68 34" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Scanning beam effect -->
    <rect x="110" y="295" width="290" height="3" fill="#0284c7" opacity="0.8"/>
    <rect x="110" y="293" width="290" height="7" fill="#38bdf8" opacity="0.3"/>
  </g>
</svg>
